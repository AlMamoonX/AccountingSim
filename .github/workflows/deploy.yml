name: Deploy AccountingSim

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accounting-sim-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_accounting
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_accounting ~/.ssh/known_hosts
      - name: Upload and deploy only AccountingSim
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > accounting-source.tar.gz
          scp -i ~/.ssh/id_accounting -o BatchMode=yes -o StrictHostKeyChecking=yes accounting-source.tar.gz "deploy@173.249.40.122:accountingsim-source-${GITHUB_SHA}.tar.gz"
          ssh -i ~/.ssh/id_accounting -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@173.249.40.122 bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          cd /home/deploy/accountingsim
          test -s .env
          previous_image=$(docker inspect accounting-sim-app-1 --format '{{.Config.Image}}')
          tar -xzf "/home/deploy/accountingsim-source-${revision}.tar.gz" -C .
          export IMAGE_TAG="$revision"
          compose=(docker compose -p accounting-sim -f docker-compose.yml -f deploy/docker-compose.shared.yml)
          "${compose[@]}" build app
          "${compose[@]}" up -d --no-build --no-deps app
          if ! curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 --max-time 15 --output /dev/null https://accounting.tryzarqa.com/login; then
            export IMAGE_TAG="${previous_image#accounting-sim:}"
            "${compose[@]}" up -d --no-build --no-deps app
            echo 'Availability check failed; previous app image restored.' >&2
            exit 1
          fi
          printf '%s\n' "$revision" > .deployed-revision
          "${compose[@]}" ps app
          REMOTE
      - name: Confirm public HTTPS
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null --write-out 'HTTPS %{http_code}\n' https://accounting.tryzarqa.com/login
