name: Deploy AccountingSim

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the app or read generation diagnostics
        type: choice
        options: [deploy, diagnose]
        default: deploy
      add_teacher:
        description: Optional doctor email to add to the server's TEACHER_EMAILS before deploying
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: accounting-sim-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_accounting
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_accounting ~/.ssh/known_hosts
      - name: Read generation diagnostics
        if: inputs.operation == 'diagnose'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_accounting -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 deploy@173.249.40.122 bash -s <<'REMOTE'
          set -euo pipefail
          echo '--- sign-in allowlist (.env line, then what the app container sees) ---'
          grep -n '^TEACHER_EMAILS=' /home/deploy/accountingsim/.env | cat -A || echo 'no TEACHER_EMAILS line in .env'
          docker exec accounting-sim-app-1 sh -c 'printf "%s" "${TEACHER_EMAILS-<unset>}"' | cat -A; echo
          docker exec -i accounting-sim-app-1 node -e 'const l=(process.env.TEACHER_EMAILS||"").split(/[,;\s]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);console.log(JSON.stringify({parsed:l,dark99mam:l.includes("dark99mam@gmail.com"),rawahi:l.includes("rawahi.s96@gmail.com")}))'
          echo '--- recent sign-in codes and users for doctor emails ---'
          docker exec -i accounting-sim-db-1 psql -U accsim -d accsim <<'SQL'
          SELECT email, created_at, expires_at, attempts, used_at FROM otp_codes
          WHERE email IN ('dark99mam@gmail.com','rawahi.s96@gmail.com') ORDER BY created_at DESC LIMIT 10;
          SELECT email, role, created_at FROM users WHERE email IN ('dark99mam@gmail.com','rawahi.s96@gmail.com');
          SQL
          echo '--- recent app log lines about auth/mail ---'
          docker logs --since 3h accounting-sim-app-1 2>&1 | grep -iE 'mail|resend|login|auth|error' | tail -30 || true
          docker exec -i accounting-sim-db-1 psql -U accsim -d accsim <<'SQL'
          SELECT created_at, kind, model, ok, prompt_tokens, completion_tokens, ms, left(error, 250) AS error
          FROM ai_logs ORDER BY id DESC LIMIT 12;
          SQL
          docker exec -i accounting-sim-app-1 node <<'NODE'
          const model = process.env.DEEPSEEK_MODEL || 'deepseek-chat';
          const base = (process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com').replace(/\/$/, '');
          fetch(base + '/models', { headers: { Authorization: 'Bearer ' + process.env.DEEPSEEK_API_KEY } })
            .then(async r => ({ status: r.status, body: await r.json() }))
            .then(({status, body}) => console.log(JSON.stringify({ status, configuredModel: model, models: body.data?.map(m => ({ id: m.id, context: m.context_window, maxOutput: m.max_output_tokens })) })))
            .catch(() => { console.error('Model metadata lookup failed'); process.exitCode = 1; });
          NODE
          REMOTE
      - name: Upload and deploy only AccountingSim
        if: inputs.operation != 'diagnose'
        env:
          ADD_TEACHER: ${{ inputs.add_teacher }}
        run: |
          set -euo pipefail
          # ssh re-parses arguments in a remote shell: keep only email characters (spaces dropped, commas separate emails).
          ADD_TEACHER=$(printf '%s' "$ADD_TEACHER" | tr -cd 'A-Za-z0-9@._%+,;-')
          git archive --format=tar.gz HEAD > accounting-source.tar.gz
          scp -i ~/.ssh/id_accounting -o BatchMode=yes -o StrictHostKeyChecking=yes accounting-source.tar.gz "deploy@173.249.40.122:accountingsim-source-${GITHUB_SHA}.tar.gz"
          ssh -i ~/.ssh/id_accounting -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@173.249.40.122 bash -s -- "$GITHUB_SHA" "$ADD_TEACHER" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          cd /home/deploy/accountingsim
          test -s .env
          previous_image=$(docker inspect accounting-sim-app-1 --format '{{.Config.Image}}')
          tar -xzf "/home/deploy/accountingsim-source-${revision}.tar.gz" -C .
          if [ -n "${2:-}" ]; then
            python3 deploy/add_teacher.py "$2"
          fi
          export IMAGE_TAG="$revision"
          compose=(docker compose -p accounting-sim -f docker-compose.yml -f deploy/docker-compose.shared.yml)
          "${compose[@]}" build app
          "${compose[@]}" up -d --no-build --no-deps app
          if ! curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 --max-time 15 --output /dev/null https://accounting.tryzarqa.com/login; then
            export IMAGE_TAG="${previous_image#accounting-sim:}"
            "${compose[@]}" up -d --no-build --no-deps app
            echo 'Availability check failed; previous app image restored.' >&2
            exit 1
          fi
          printf '%s\n' "$revision" > .deployed-revision
          "${compose[@]}" ps app
          REMOTE
      - name: Confirm public HTTPS
        if: inputs.operation != 'diagnose'
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null --write-out 'HTTPS %{http_code}\n' https://accounting.tryzarqa.com/login
